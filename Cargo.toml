[package]
description = "PMS5003 air quality sensor interface"
name = "pms5003"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
keywords = ["hardware"]
repository = "https://github.com/shutton/pms5003-rs.git"

[features]
default = ["aqi"]
aqi = ["dep:aqi"]

[dependencies]
aqi = { version = "0.2", optional = true }
bincode = "1"
chrono = "0.4"
futures = "0.3"
futures-io = "0.3"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serialport = "4"
thiserror = "1"
tokio = { version = "1", features = ["macros", "sync", "rt"] }
tokio-stream = "0.1"

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
humantime = "2"
tokio = { version = "1", features = ["macros"] }
